spring.application.name=app
#Conexion Bases de Datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

#Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
#logging.level.org.flywaydb=DEBUG

#Al retornar Errores, no debe Mostrarse el trace -> este incluye las entidades del sistema
server.error.include-stacktrace=never

#SECRET KEY JWT
api.security.token.service=${SECRET_TOKEN}

#Configuracion de Envio de Correos

brevo.key=${BREVO_KEY}

spring.mail.host=${BREVO_HOST}
spring.mail.port=${BREVO_PORT}
spring.mail.username=${BREVO_USER}
spring.mail.password=${BREVO_PASSWORD}

spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.ssl.trust=smtp-relay.brevo.com
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.properties.mail.debug=true

#ApiKey de Carspecs
rapidapi.key=${RAPIDAPI_KEY}
rapidapi.host=${RAPIDAPI_HOST}

email.sender=${EMAIL_SENDER}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE